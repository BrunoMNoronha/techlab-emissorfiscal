# CI offline NFC-e.
#
# A prova (scripts/verify.ps1) é offline e multiplataforma (pwsh + dotnet, sem
# IO fiscal nem certificado), então roda em Linux no caminho principal — o
# ubuntu-24.04 já traz o pwsh. O Windows passou a rodar só semanalmente e sob
# demanda, para manter a garantia de plataforma sem gastar minutos a cada push.
# NUGET_PACKAGES fica em runner.temp de propósito: o valor da prova é o restore
# bloqueado a frio, então este workflow não usa cache de NuGet.
name: CI offline NFC-e

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'schemas/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/packages.lock.json'
      - 'EmissorFiscal.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/ci-offline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'schemas/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/packages.lock.json'
      - 'EmissorFiscal.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - '.gitattributes'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/ci-offline.yml'
  schedule:
    # Prova semanal em Windows (segunda, 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prova offline / Linux / SDK fixado
    # Não roda no agendamento: o agendamento existe para a prova em Windows.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Instalar SDK de global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore bloqueado, build, testes e CLI
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/ef04-nuget
        run: ./scripts/verify.ps1
      - name: Resumo da execução
        if: always()
        run: |
          $taskSummaryFile = Get-ChildItem -Path TestResults/ci/*/summary.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($taskSummaryFile) {
            $taskSummary = Get-Content -LiteralPath $taskSummaryFile.FullName -Raw | ConvertFrom-Json
            @(
              '### Prova NFC-e exclusivamente offline (Linux)'
              "Estado: $($taskSummary.status); exit: $($taskSummary.exitCode)"
              "Commit: $($taskSummary.commit)"
              "SDK: $($taskSummary.sdk); runtime: $($taskSummary.runtime)"
              "Runner: $($taskSummary.runner.os) / $($taskSummary.runner.architecture)"
              "Testes: $($taskSummary.testCounters | ConvertTo-Json -Compress)"
              "Modelos preparados: $($taskSummary.modelPreparations | ConvertTo-Json -Compress)"
              "Erro: $($taskSummary.error)"
              'Sem certificado de contribuinte, transmissão ou homologação fiscal.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: Publicar evidências selecionadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            TestResults/ci/*/summary.json
            TestResults/ci/*/test-results.trx
            TestResults/ci/*/cli-schemas.json
            TestResults/ci/*/cli-demo.json
            TestResults/ci/*/sdk.log
            TestResults/ci/*/restore.log
            TestResults/ci/*/build.log
            TestResults/ci/*/test.log
            TestResults/ci/*/schemas.log
            TestResults/ci/*/demo.log
            TestResults/ci/*/prepare-*.log
            TestResults/ci/*/preparation-*/summary.json
            TestResults/ci/*/preparation-*/*.xml

  validate-windows:
    name: Prova offline / Windows / SDK fixado
    # Garantia de plataforma: só no agendamento semanal e sob demanda.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Instalar SDK de global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore bloqueado, build, testes e CLI
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/ef04-nuget
        run: ./scripts/verify.ps1
      - name: Publicar evidências selecionadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            TestResults/ci/*/summary.json
            TestResults/ci/*/test-results.trx
            TestResults/ci/*/cli-schemas.json
            TestResults/ci/*/cli-demo.json
            TestResults/ci/*/*.log
            TestResults/ci/*/preparation-*/summary.json
            TestResults/ci/*/preparation-*/*.xml

  docker:
    name: Containerização / Linux / Docker
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build da imagem (restore bloqueado, build Release e testes)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: emissorfiscal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da CLI (schemas e demo emitem JSON)
        run: |
          docker run --rm emissorfiscal:ci schemas | jq -e . > /dev/null
          docker run --rm emissorfiscal:ci demo | jq -e . > /dev/null
          echo 'CLI containerizada respondeu schemas e demo com JSON válido.' >> "$GITHUB_STEP_SUMMARY"
